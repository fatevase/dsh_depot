{
  "name": "Candidate package downloads",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "distribution/candidate-downloads.mjs",
        ".github/workflows/candidate-downloads.yml"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "run_id": {
          "description": "Existing full candidate build run; empty selects latest",
          "type": "string"
        }
      }
    },
    "workflow_run": {
      "workflows": [
        "Popular candidate builds (99 plugins)"
      ],
      "types": [
        "completed"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "candidate-package-downloads",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "(github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)",
      "runs-on": "ubuntu-24.04",
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund"
        },
        {
          "run": "node distribution/candidate-downloads.mjs",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "CANDIDATE_RUN_ID": "${{ inputs.run_id }}"
          }
        }
      ]
    }
  }
}
