{
  "name": "Refresh latest DSH and plugins",
  "on": {
    "schedule": [
      {
        "cron": "7 */6 * * *"
      }
    ],
    "workflow_dispatch": {},
    "pull_request": {
      "paths": [
        "distribution/update-latest.mjs",
        "distribution/lib/latest.mjs",
        ".github/workflows/latest-update.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "distribution/update-latest.mjs",
        "distribution/lib/latest.mjs",
        ".github/workflows/latest-update.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "latest-input-update",
    "cancel-in-progress": false
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-24.04",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org"
        },
        {
          "run": "node --test distribution/test/latest.test.mjs distribution/test/candidate-updates.test.mjs"
        }
      ]
    },
    "refresh": {
      "if": "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'",
      "needs": "test",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org"
        },
        {
          "run": "node distribution/update-latest.mjs refresh",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "npm test"
        },
        {
          "run": "node distribution/update-latest.mjs snapshot"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "latest-update",
            "path": ".runtime/latest-update/snapshot.json\n.runtime/latest-update/report.json",
            "retention-days": 7
          }
        },
        {
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "latest-update-diagnostics",
            "path": ".runtime/latest-update/report.json\n.runtime/latest-update/*-lock.log",
            "retention-days": 7,
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "publish": {
      "needs": "refresh",
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "write",
        "actions": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org"
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "latest-update",
            "path": ".runtime/latest-update"
          }
        },
        {
          "run": "node distribution/update-latest.mjs publish",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        }
      ]
    }
  }
}
