{
  "name": "DSH manager distributions",
  "on": {
    "pull_request": {
      "paths": [
        "plugins/dsh-depot-manager/**",
        "packages/offline-format/**",
        "distribution/manager/**",
        "distribution/lib/**",
        "distribution/isolation/**",
        "distribution/host/**",
        "distribution/test/manager-*.test.mjs",
        "package.json",
        "package-lock.json",
        ".github/workflows/manager-distribution.yml",
        "distribution/config.json"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "publish": {
          "description": "Publish only fully accepted manager assets (default branch only)",
          "type": "boolean",
          "default": false
        },
        "channel": {
          "description": "Preview publishes built assets with incomplete acceptance clearly labelled; stable requires full acceptance",
          "type": "choice",
          "options": [
            "stable",
            "preview"
          ],
          "default": "stable"
        }
      }
    },
    "push": {
      "paths": [
        "plugins/dsh-depot-manager/**",
        "packages/offline-format/**",
        "distribution/manager/**",
        "distribution/lib/**",
        "distribution/isolation/**",
        "distribution/host/**",
        "distribution/test/manager-*.test.mjs",
        "package.json",
        "package-lock.json",
        ".github/workflows/manager-distribution.yml",
        "distribution/config.json"
      ],
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "build": {
      "runs-on": "${{ matrix.runner }}",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "macos-arm64",
              "runner": "macos-14"
            },
            {
              "target": "linux-x64",
              "runner": "ubuntu-24.04"
            },
            {
              "target": "win32-x64",
              "runner": "windows-2025"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund"
        },
        {
          "run": "node --test --test-concurrency=4 plugins/dsh-depot-manager/test/*.test.mjs && node --test distribution/test/manager-*.test.mjs",
          "name": "Test manager with bounded process concurrency"
        },
        {
          "if": "matrix.target == 'win32-x64'",
          "shell": "pwsh",
          "run": "./distribution/isolation/prepare-windows.ps1"
        },
        {
          "run": "node distribution/manager/ci.mjs build ${{ matrix.target }} .runtime/manager-ci/${{ matrix.target }}"
        },
        {
          "name": "Verify actual official Windows Desktop CLI",
          "if": "matrix.target == 'win32-x64'",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$Root = Join-Path $PWD '.runtime/official-windows-desktop'\nNew-Item -ItemType Directory -Force $Root | Out-Null\nInvoke-WebRequest 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -OutFile \"$Root/installer.exe\"\n& 7z e \"$Root/installer.exe\" '-o.runtime/official-windows-desktop/payload' '$PLUGINSDIR/app-64.7z' -y\nif ($LASTEXITCODE -ne 0) { throw 'Desktop NSIS extraction failed' }\n& 7z x \"$Root/payload/app-64.7z\" '-o.runtime/official-windows-desktop/app' -y\nif ($LASTEXITCODE -ne 0) { throw 'Desktop application extraction failed' }\nnode distribution/manager/native-desktop-smoke.mjs \"$Root/app\" .runtime/manager-ci/win32-x64\nif ($LASTEXITCODE -ne 0) { throw 'Desktop native CLI regression failed' }",
          "id": "native-desktop"
        },
        {
          "name": "Exclude failed Desktop target from publication",
          "if": "failure() && matrix.target == 'win32-x64'",
          "shell": "pwsh",
          "run": "Remove-Item -LiteralPath '.runtime/manager-ci/win32-x64/receipt.json' -ErrorAction SilentlyContinue"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "manager-${{ matrix.target }}",
            "path": ".runtime/manager-ci/${{ matrix.target }}/*.tgz\n.runtime/manager-ci/${{ matrix.target }}/*.zip\n.runtime/manager-ci/${{ matrix.target }}/receipt.json\n.runtime/manager-ci/${{ matrix.target }}/SHA256SUMS\n.runtime/manager-ci/${{ matrix.target }}/manager-verification.json\n.runtime/manager-ci/${{ matrix.target }}/verification/**/*.json\n.runtime/manager-ci/${{ matrix.target }}/verification/**/*.log\n.runtime/manager-ci/${{ matrix.target }}/export-roundtrip.json\n.runtime/manager-ci/${{ matrix.target }}/export-roundtrip/target-verification/**/*.json\n.runtime/manager-ci/${{ matrix.target }}/export-roundtrip/*.log\n.runtime/manager-ci/${{ matrix.target }}/export-roundtrip/target-verification/**/*.log\n.runtime/manager-ci/${{ matrix.target }}/native-desktop.json\n.runtime/manager-ci/${{ matrix.target }}/native-desktop/*.log",
            "retention-days": 2,
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "publish": {
      "if": "always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "needs": [
        "build"
      ],
      "runs-on": "ubuntu-24.04",
      "permissions": {
        "contents": "write"
      },
      "concurrency": {
        "group": "manager-release",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "26.9.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund"
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "pattern": "manager-*",
            "path": ".runtime/manager-publication"
          }
        },
        {
          "run": "node distribution/manager/ci.mjs publication .runtime/manager-publication ${{ github.event_name == 'push' && 'preview' || inputs.channel || 'stable' }}"
        },
        {
          "name": "Publish exact files with explicit acceptance status",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPO": "${{ github.repository }}"
          },
          "run": "node distribution/manager/publish-release.mjs .runtime/manager-publication/publication.json"
        }
      ]
    }
  }
}
